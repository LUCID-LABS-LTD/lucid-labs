<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Lucid Labs Ltd — mark (dark theme)</title>
  <defs>
    <filter id="phosphor-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#phosphor-glow)">
    <polyline points="36,30 68,60 36,90" fill="none" stroke="#FFB000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <rect x="76" y="74" width="28" height="13" fill="#FFB000"></rect>
  </g>
</svg>