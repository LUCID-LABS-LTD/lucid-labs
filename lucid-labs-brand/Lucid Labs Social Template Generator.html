  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

var(--text);}\n  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}\n  .field label{font-size:10px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;}\n  .field input, .field textarea{\n    background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:13px;\n    padding:8px 10px; border-radius:2px; resize:vertical;\n  }\n  .field input:focus, .field textarea:focus{outline:none;border-color:var(--amber);}\n  .panel-heading{font-size:11px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px;}\n  .export-btn{\n    width:100%;margin-top:8px;background:var(--amber);color:#1A1200;border:none;font-family:inherit;font-weight:700;\n    font-size:13px;letter-spacing:0.06em;padding:14px;cursor:pointer;border-radius:2px;text-transform:uppercase;\n  }\n  .export-btn:hover{background:#ffc23d;}\n  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}\n\n  /* ---- preview stage ---- */\n  .stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:\n    repeating-linear-gradient(45deg, #0d0c09 0 12px, #0a0908 12px 24px);}\n  .frame{width:460px;height:460px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.6);}\n  .canvas1080{width:1080px;height:1080px;transform:scale(0.4259);transform-origin:top left;position:relative;}\n\n  /* ---- shared template chrome ---- */\n  .tpl{width:1080px;height:1080px;position:relative;overflow:hidden;display:none;}\n  .tpl.active{display:block;}\n  .scanlines::before{\n    content:\"\";position:absolute;inset:0;pointer-events:none;\n    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);\n    mix-blend-mode:overlay;\n  }\n  .mark{position:absolute;display:flex;align-items:center;gap:14px;}\n  .mark img{width:34px;height:34px;}\n  .mark .wm{font-size:15px;font-weight:700;letter-spacing:0.1em;}\n  .amber-word{color:var(--amber);}\n  .paper .amber-word{color:var(--p-amber);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\">\n\n  <!-- ============ SIDEBAR ============ -->\n  <div class=\"sidebar\">\n    <div class=\"brandline\">LUCID LABS LTD<\u002Fdiv>\n    <div class=\"h1\">Social Template Generator<\u002Fdiv>\n\n    <div class=\"tabs\" id=\"tabs\"><\u002Fdiv>\n\n    <div class=\"panel-heading\">Edit content<\u002Fdiv>\n    <div id=\"fields\"><\u002Fdiv>\n\n    <button class=\"export-btn\" id=\"exportBtn\">Export PNG — 1080×1080<\u002Fbutton>\n\n    <div class=\"note\">Edit any field above, then export. Kicker/title-bar defaults match brand spec exactly — change only if you know what you're doing. Amber is emphasis-only (~10% max); green is reserved for \"BUILT\" chips.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ PREVIEW STAGE ============ -->\n  <div class=\"stage\">\n    <div class=\"frame\">\n      <div class=\"canvas1080\" id=\"canvasWrap\">\n\n        <!-- (a) ANNOUNCEMENT -->\n        <div class=\"tpl scanlines active\" id=\"tpl-announcement\" style=\"background:var(--bg);\">\n          <div style=\"position:absolute;top:64px;left:64px;font-size:16px;letter-spacing:0.14em;color:var(--amber);\" data-field=\"Kicker\" data-tpl=\"announcement\">LUCID LABS LTD · DEEP-TECH · NIGERIA<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:340px;right:120px;font-size:64px;font-weight:800;line-height:1.18;letter-spacing:0.01em;text-transform:uppercase;\">\n            <span data-field=\"Headline — part 1\" data-tpl=\"announcement\">NIGERIA'S FIRST <\u002Fspan><span class=\"amber-word\" data-field=\"Headline — emphasis\" data-tpl=\"announcement\">AUTONOMOUS<\u002Fspan><span data-field=\"Headline — part 2\" data-tpl=\"announcement\"> DELIVERY FLEET IS LIVE.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:640px;right:160px;font-size:22px;color:var(--muted);line-height:1.6;\" data-field=\"Subcopy\" data-tpl=\"announcement\">Built end-to-end in Lagos — navigation, power, and fleet control, engineered from zero.<\u002Fdiv>\n          <div class=\"mark\" style=\"right:64px;bottom:56px;\">\n            <img src=\"da11de43-4854-40b8-9629-0236d421b587\" alt=\"\">\n            <div class=\"wm\">LUCID LABS <span style=\"color:var(--muted);font-weight:500;\">LTD<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- (b) BUILD LOG -->\n        <div class=\"tpl scanlines\" id=\"tpl-buildlog\" style=\"background:var(--bg);\">\n          <div style=\"position:absolute;left:64px;top:64px;right:64px;bottom:64px;border:1px solid var(--border);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border);\">\n              <div style=\"width:13px;height:13px;border-radius:50%;background:#5A5548;\"><\u002Fdiv>\n              <div style=\"width:13px;height:13px;border-radius:50%;background:#5A5548;\"><\u002Fdiv>\n              <div style=\"width:13px;height:13px;border-radius:50%;background:#5A5548;\"><\u002Fdiv>\n              <div style=\"flex:1;text-align:center;font-size:16px;color:var(--muted);letter-spacing:0.04em;\" data-field=\"Title bar text\" data-tpl=\"buildlog\">lucidlabs-ltd — build.log<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:34px 40px 0 40px;font-size:19px;line-height:2.1;\">\n              <div><span style=\"color:var(--amber);\">$<\u002Fspan> <span data-field=\"Command line 1\" data-tpl=\"buildlog\">flash --target=wearable-v3<\u002Fspan><\u002Fdiv>\n              <div><span style=\"color:var(--amber);\">$<\u002Fspan> <span data-field=\"Command line 2\" data-tpl=\"buildlog\">run drop_test.sim --height=2m<\u002Fspan><\u002Fdiv>\n              <div><span style=\"color:var(--amber);\">$<\u002Fspan> <span data-field=\"Command line 3\" data-tpl=\"buildlog\">status: PASS — 0 faults<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;margin:26px 40px 0 40px;border:1px dashed var(--border);border-radius:4px;background:repeating-linear-gradient(135deg, rgba(255,176,0,0.05) 0 14px, transparent 14px 28px);display:flex;align-items:center;justify-content:center;\">\n              <div style=\"font-size:13px;letter-spacing:0.08em;color:var(--muted);\">[ BUILD PHOTO — DROP IMAGE HERE ]<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:20px 40px 26px 40px;font-size:14px;color:var(--muted);\">\n              <div data-field=\"Date stamp\" data-tpl=\"buildlog\">2026.07.07 // LAGOS, NG<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;\"><img src=\"da11de43-4854-40b8-9629-0236d421b587\" style=\"width:18px;height:18px;\" alt=\"\"><span style=\"letter-spacing:0.08em;\">LUCID LABS LTD<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- (c) MILESTONE -->\n        <div class=\"tpl scanlines\" id=\"tpl-milestone\" style=\"background:var(--bg);\">\n          <div style=\"position:absolute;top:64px;left:64px;font-size:16px;letter-spacing:0.14em;color:var(--amber);\">LUCID LABS LTD · MILESTONE<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:150px;right:120px;font-size:46px;font-weight:800;line-height:1.25;text-transform:uppercase;\" data-field=\"Title\" data-tpl=\"milestone\">Wearable V3 — Drop Test<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:400px;display:flex;gap:16px;\">\n            <div style=\"border:1px solid var(--amber);color:var(--amber);font-size:15px;letter-spacing:0.1em;padding:10px 20px;border-radius:20px;\" data-field=\"Amber chip label\" data-tpl=\"milestone\">IN PROGRESS<\u002Fdiv>\n            <div style=\"border:1px solid var(--green);color:var(--green);font-size:15px;letter-spacing:0.1em;padding:10px 20px;border-radius:20px;\" data-field=\"Green chip label\" data-tpl=\"milestone\">BUILT<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:520px;right:64px;font-size:38px;letter-spacing:0.04em;color:var(--amber);\" data-field=\"ASCII progress bar\" data-tpl=\"milestone\">████████████░░░░░░░░ 62%<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:610px;right:140px;font-size:20px;color:var(--muted);line-height:1.6;\" data-field=\"Description\" data-tpl=\"milestone\">Structural + waterproof pass complete. Firmware validation next.<\u002Fdiv>\n          <div class=\"mark\" style=\"right:64px;bottom:56px;\">\n            <img src=\"da11de43-4854-40b8-9629-0236d421b587\" alt=\"\">\n            <div class=\"wm\">LUCID LABS <span style=\"color:var(--muted);font-weight:500;\">LTD<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- (d) QUOTE / VISION -->\n        <div class=\"tpl scanlines\" id=\"tpl-quote\" style=\"background:var(--bg);\">\n          <div style=\"position:absolute;left:110px;top:230px;font-size:120px;font-weight:800;color:var(--amber);line-height:1;\">“<\u002Fdiv>\n          <div style=\"position:absolute;left:110px;right:110px;top:400px;font-size:48px;font-weight:700;line-height:1.35;text-align:center;\">\n            <span data-field=\"Quote — part 1\" data-tpl=\"quote\">Safety is not a feature we add. It is <\u002Fspan><span class=\"amber-word\" data-field=\"Quote — emphasis\" data-tpl=\"quote\">the system we build.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;top:700px;text-align:center;font-size:19px;letter-spacing:0.06em;color:var(--muted);\" data-field=\"Attribution\" data-tpl=\"quote\">— LUCID LABS LTD<\u002Fdiv>\n          <div class=\"mark\" style=\"right:64px;bottom:56px;\">\n            <img src=\"da11de43-4854-40b8-9629-0236d421b587\" alt=\"\">\n            <div class=\"wm\">LUCID LABS <span style=\"color:var(--muted);font-weight:500;\">LTD<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- (e) PRODUCT UPDATE — PAPER THEME -->\n        <div class=\"tpl paper\" id=\"tpl-product\" style=\"background:var(--p-bg);color:var(--p-text);\">\n          <div style=\"position:absolute;top:64px;left:64px;font-size:16px;letter-spacing:0.14em;color:var(--p-amber);\" data-field=\"Kicker\" data-tpl=\"product\">LUCID LABS LTD · PRODUCT UPDATE<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:220px;right:120px;font-size:52px;font-weight:800;line-height:1.25;\">\n            <span data-field=\"Headline — part 1\" data-tpl=\"product\">A gentler way to keep <\u002Fspan><span class=\"amber-word\" data-field=\"Headline — emphasis\" data-tpl=\"product\">watch<\u002Fspan><span data-field=\"Headline — part 2\" data-tpl=\"product\"> over your child.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:64px;top:520px;right:150px;font-size:22px;line-height:1.7;color:var(--p-muted);\" data-field=\"Body copy\" data-tpl=\"product\">The wearable now alerts a parent's phone within 2 seconds of a geofence exit — reviewed with three paediatric safety boards before shipping.<\u002Fdiv>\n          <div style=\"position:absolute;left:64px;bottom:56px;display:flex;align-items:center;gap:14px;\">\n            <img src=\"5763e72b-a0b9-4d6c-8bb4-8499950096ca\" style=\"width:34px;height:34px;\" alt=\"\">\n            <div style=\"font-size:15px;font-weight:700;letter-spacing:0.1em;\">LUCID LABS <span style=\"color:var(--p-muted);font-weight:500;\">LTD<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;right:64px;bottom:60px;font-size:13px;letter-spacing:0.06em;color:var(--p-muted);\" data-field=\"Footer tag\" data-tpl=\"product\">v3.1 · CHILD SAFETY UPDATE<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<script>\n  const TEMPLATES = [\n    {id:'announcement', label:'(a) Announcement'},\n    {id:'buildlog', label:'(b) Build log'},\n    {id:'milestone', label:'(c) Milestone'},\n    {id:'quote', label:'(d) Quote / vision'},\n    {id:'product', label:'(e) Product update — paper'},\n  ];\n  let active = 'announcement';\n\n  const tabsEl = document.getElementById('tabs');\n  const fieldsEl = document.getElementById('fields');\n\n  function renderTabs(){\n    tabsEl.innerHTML = '';\n    TEMPLATES.forEach(t => {\n      const btn = document.createElement('button');\n      btn.className = 'tab-btn' + (t.id === active ? ' active' : '');\n      btn.textContent = t.label;\n      btn.onclick = () => { active = t.id; showActive(); };\n      tabsEl.appendChild(btn);\n    });\n  }\n\n  function showActive(){\n    document.querySelectorAll('.tpl').forEach(el => el.classList.remove('active'));\n    document.getElementById('tpl-' + active).classList.add('active');\n    renderTabs();\n    renderFields();\n  }\n\n  function renderFields(){\n    fieldsEl.innerHTML = '';\n    const scope = document.querySelectorAll('[data-tpl=\"' + active + '\"]');\n    scope.forEach((el, i) => {\n      const wrap = document.createElement('div');\n      wrap.className = 'field';\n      const lab = document.createElement('label');\n      lab.textContent = el.dataset.field;\n      const long = el.textContent.length > 40;\n      const input = document.createElement(long ? 'textarea' : 'input');\n      if (!long) input.type = 'text';\n      else input.rows = 3;\n      input.value = el.textContent;\n      input.addEventListener('input', () => { el.textContent = input.value; });\n      wrap.appendChild(lab);\n      wrap.appendChild(input);\n      fieldsEl.appendChild(wrap);\n    });\n  }\n\n  document.getElementById('exportBtn').addEventListener('click', () => {\n    const original = document.getElementById('tpl-' + active);\n    const clone = original.cloneNode(true);\n    clone.classList.add('active');\n    clone.style.transform = 'none';\n    clone.style.position = 'fixed';\n    clone.style.left = '-99999px';\n    clone.style.top = '0';\n    clone.style.display = 'block';\n    document.body.appendChild(clone);\n    html2canvas(clone, {width:1080, height:1080, scale:1, backgroundColor:null}).then(canvas => {\n      const link = document.createElement('a');\n      link.download = 'lucid-labs-' + active + '.png';\n      link.href = canvas.toDataURL('image/png');\n      link.click();\n      document.body.removeChild(clone);\n    });\n  });\n\n  renderTabs();\n  renderFields();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
